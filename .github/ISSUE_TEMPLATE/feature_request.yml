name: 功能建议
description: 动画、皮肤、设置项或工程改进
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        请先看 `docs/design/design-spec-v6.md` 与 `MAINTAIN.md`，避免和既有设计口径冲突。
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 描述使用场景，而不是只给方案。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案 / 取舍
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - 启动动画
        - 交接转场
        - 音轨
        - 皮肤 / 主题
        - 毛玻璃 / 通透度
        - composer 光边框
        - 设置页
        - 安装 / 构建 / CI
        - 文档
    validations:
      required: true
